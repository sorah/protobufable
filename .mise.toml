[tools]
ruby = "4.0.6"
"aqua:bufbuild/buf" = "1.58.0"
"aqua:jdx/hk" = "2.0.1"
"aqua:apple/pkl" = "0.31.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

[settings]
disable_backends = ["asdf"]

[settings.ruby]
compile = false

[tasks.pre-commit]
run = "hk run pre-commit"

[tasks.protoc]
description = "Regenerate the spec fixture message classes from the .proto sources"
# buf resolves the dependency tree; protoc does the generating. Only Ruby is generated:
# protoc's --rbs_out targets a google-protobuf signature set that does not exist publicly yet
# and contradicts the one protovalidate ships. See DESIGN.md.
run = [
  "rm -rf tmp/protoinc",
  "rm -f spec/fixtures/protobufable/problem_pb.rb spec/fixtures/protobufable/testing/v1/fixtures_pb.rb spec/fixtures/google/rpc/error_details_pb.rb",
  "buf export --output tmp/protoinc",
  "protoc -I tmp/protoinc --ruby_out=spec/fixtures protobufable/problem.proto protobufable/testing/v1/fixtures.proto google/rpc/error_details.proto",
]
