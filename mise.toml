[tools]
ruby = "4.0.6"
"aqua:bufbuild/buf" = "1.58.0"
"aqua:jdx/hk" = "2.0.1"
"aqua:apple/pkl" = "0.31.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

[settings]
disable_backends = ["asdf"]

[settings.ruby]
compile = false

[tasks.pre-commit]
run = "hk run pre-commit"

[tasks.protoc]
description = "Regenerate the Ruby message classes from the .proto sources"
# Three inputs, two templates: the schema the gem publishes goes to lib/, and the fixtures and
# the one googleapis file they need go to spec/, which is never shipped. RBS is not generated —
# see DESIGN.md.
run = [
  "rm -f lib/protobufable/problem_pb.rb",
  "rm -f spec/fixtures/protobufable/testing/v1/fixtures_pb.rb spec/fixtures/google/rpc/error_details_pb.rb",
  "buf generate proto --template buf.gen.yaml",
  "buf generate spec/proto --template buf.gen.spec.yaml",
  "buf generate buf.build/googleapis/googleapis --path google/rpc/error_details.proto --template buf.gen.spec.yaml",
]
